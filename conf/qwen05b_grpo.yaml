defaults:
  - math
  - override finetune: grpo
  - _self_

# Qwen 0.5B model for multi-trainer GRPO experiment
model_path: Qwen/Qwen2.5-0.5B

# Multi-trainer configuration: 2 isolated trainer groups
# Each group has its own actor(s) and trainer(s)
# Weight updates: Trainer N -> Actor N (isolated per group)
# Rollouts: All Actors -> Shared Stream -> All Trainers (broadcast)
#
# With 4 GPUs and 2 replicas:
#   - 2 GPUs for actors (1 per group)
#   - 2 GPUs for finetune (1 per group)
world:
  replicas: 1
  actor_fraction: 1
  finetune_fraction: 1
  preprocessor_fraction: 0

eval_every_n_versions: 0

finetune:
  seq_length: 4096
  train_batch_size: 1
  gradient_accumulation_passes: 16
  attempts: 2

vllm_config:
  vllm_kwargs:
    max_model_len: 4096

llm:
  parameters:
    max_tokens: 512

test_llm:
  parameters:
    max_tokens: 512

